# хелена-фит.рф (punycode: xn----7sboarop7bqd.xn--p1ai)
# Зеркало основного конфига helena-fit.ru со своим сертификатом.

# HTTP: ACME-челлендж для certbot + редирект на HTTPS
server {
    listen 80;
    server_name xn----7sboarop7bqd.xn--p1ai www.xn----7sboarop7bqd.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot-rf;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Telegram Mini App + API
server {
    listen 443 ssl;
    server_name xn----7sboarop7bqd.xn--p1ai www.xn----7sboarop7bqd.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/helena-rf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helena-rf/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/www/helena-fit/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        root /var/www/helena-fit/telegram-app/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root /var/www/helena-fit/telegram-app/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Админка
server {
    listen 8080 ssl;
    server_name xn----7sboarop7bqd.xn--p1ai www.xn----7sboarop7bqd.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/helena-rf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helena-rf/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    root /var/www/helena-fit/admin-panel/dist;
    index index.html;

    # Таймаут 5 мин — синхронная рассылка по базе идёт ~2 минуты
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads {
        proxy_pass http://localhost:3000;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
