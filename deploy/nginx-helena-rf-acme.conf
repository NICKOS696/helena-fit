# Временный конфиг: только HTTP для получения сертификата certbot
server {
    listen 80;
    server_name xn----7sboarop7bqd.xn--p1ai www.xn----7sboarop7bqd.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot-rf;
    }
    location / {
