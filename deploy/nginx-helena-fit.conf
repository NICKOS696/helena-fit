server {
    server_name helena-fit.ru www.helena-fit.ru;

    client_max_body_size 20M;

    # Backend API
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads - раздаём напрямую из папки
    location /uploads/ {
        alias /var/www/helena-fit/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Хэшированные ассеты — кэшируем надолго (имя меняется при сборке)
    location /assets/ {
        root /var/www/helena-fit/telegram-app/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Telegram App (root). index.html — без кэша, чтобы обновления подхватывались сразу
    location / {
        root /var/www/helena-fit/telegram-app/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/helena-fit.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/helena-fit.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 8080;
    server_name helena-fit.ru www.helena-fit.ru;

    client_max_body_size 20M;

    root /var/www/helena-fit/admin-panel/dist;
    index index.html;

    # Backend API через proxy
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads
    location /uploads {
        proxy_pass http://localhost:3000;
    }

    # Хэшированные ассеты — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Админка. index.html — без кэша
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
server {
    if ($host = helena-fit.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name helena-fit.ru www.helena-fit.ru;
    return 404; # managed by Certbot


}
