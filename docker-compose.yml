version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: helena-fit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: helena_fit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Доступ к БД только с localhost (через SSH-туннель), не наружу.
      - "127.0.0.1:5434:5432"
    networks:
      - helena-fit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helena_fit"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helena-fit-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/helena_fit?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      PORT: 3000
      NODE_ENV: production
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE: 10485760
      TELEGRAM_APP_URL: ${TELEGRAM_APP_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID}
      PAYME_TEST_KEY: ${PAYME_TEST_KEY}
      PAYME_PROD_KEY: ${PAYME_PROD_KEY}
      PAYME_ENDPOINT: ${PAYME_ENDPOINT}
      PAYME_CALLBACK_URL: ${PAYME_CALLBACK_URL}
      # Аварийный рубильник проверки подписи Telegram (по умолчанию выключен = проверка включена)
      DISABLE_TELEGRAM_SIGNATURE_CHECK: ${DISABLE_TELEGRAM_SIGNATURE_CHECK:-false}
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "3000:3000"
    networks:
      - helena-fit-network
    # db push идемпотентен и без --accept-data-loss не удаляет данные (при дрейфе упадёт с ошибкой).
    # nest build вкладывает выход в dist/src/ (т.к. компилируется prisma/seed.ts),
    # поэтому точка входа — dist/src/main, а не dist/main.
    command: sh -c "npx prisma db push --skip-generate && node dist/src/main"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  helena-fit-network:
    driver: bridge
